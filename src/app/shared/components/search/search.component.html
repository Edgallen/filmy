<div role="search">
  <app-input
    [formControl]="control"
    prefixIcon="/icons/search.svg"
    placeholder="Поиск"
    ariaLabel="Поиск фильмов"
  >
    <button
      inputAction
      class="search__submit"
      type="button"
      [disabled]="disabled()"
      (click)="onSearch()"
      aria-label="Найти фильмы"
      title="Найти фильмы"
    >
      <img ngSrc="/icons/arrow-right.svg" width="20" height="20" alt="" />
    </button>
  </app-input>
</div>
