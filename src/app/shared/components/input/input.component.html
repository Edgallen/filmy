<div class="form__control">
  <div class="form__icon">
    @if (iconUrl()) {
      <img class="form__icon-image" [src]="iconUrl()" alt="" />
    }
  </div>

  <input
    class="form__input"
    [type]="type()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [value]="value()"
    (input)="onInput($event)"
  />

  <ng-content select="[inputAction]" />
</div>
