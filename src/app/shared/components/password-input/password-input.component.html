<app-input
  [formControl]="control"
  [prefixIcon]="prefixIcon()"
  [type]="type()"
  [placeholder]="placeholder()"
  [ariaLabel]="ariaLabel()"
  [invalid]="invalid()"
  [describedBy]="describedBy()"
  autocomplete="current-password"
>
  <button
    inputAction
    type="button"
    class="password-input__toggle"
    [disabled]="disabled()"
    [attr.title]="type() === 'password' ? 'Показать пароль' : 'Скрыть пароль'"
    [attr.aria-label]="
      type() === 'password' ? 'Показать пароль' : 'Скрыть пароль'
    "
    (click)="onButtonToggleClick()"
  >
    <img
      class="password-input__icon"
      [ngSrc]="buttonIcon()"
      width="16"
      height="16"
      alt=""
    />
  </button>
</app-input>
