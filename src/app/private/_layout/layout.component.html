<div class="private-layout">
  <header class="private-layout__header">
    <a
      class="private-layout__logo"
      routerLink="/private/home"
      aria-label="Filmy: на главную"
    >
      <img
        priority
        ngSrc="/images/logo.png"
        width="117"
        height="29"
        alt="Filmy"
      />
    </a>

    <nav class="private-layout__menu" aria-label="Основная навигация">
      @for (navLink of navLinks; track navLink.id) {
        <div
          class="private-layout__menu-item"
          [routerLink]="navLink.disabled ? null : navLink.link"
          queryParamsHandling="preserve"
          routerLinkActive
          [routerLinkActiveOptions]="{ exact: true }"
          #rla="routerLinkActive"
        >
          <app-nav-button
            [text]="navLink.text"
            [iconUrl]="navLink.iconUrl"
            [disabled]="navLink.disabled"
            [isActive]="rla.isActive"
          />
        </div>
      }
    </nav>
  </header>

  <div class="private-layout__body">
    <aside class="private-layout__filters" aria-label="Фильтры фильмов">
      @if (!routeState().hideSearch) {
        <app-search
          class="private-layout__search"
          [value]="filters().name"
          (searchValue)="onSearch($event)"
        />
      }

      <fieldset class="private-layout__genres">
        <legend class="private-layout__label">Жанр</legend>
        @for (genre of genres$ | async; track genre.id) {
          <label class="private-layout__genre">
            <input
              class="private-layout__radio"
              type="radio"
              name="genre"
              [value]="genre.id"
              [ngModel]="filters().genre ?? 0"
              (ngModelChange)="
                updateFilters({ genre: $event === 0 ? null : $event })
              "
            />
            <span>{{ genre.name }}</span>
          </label>
        }
      </fieldset>

      <fieldset class="private-layout__genres private-layout__filter-group">
        <legend class="private-layout__label">Дата выхода</legend>
        <div class="private-layout__years">
          <input
            class="private-layout__year"
            type="number"
            name="from"
            aria-label="Год выхода от"
            placeholder="От"
            min="1888"
            [ngModel]="filters().from"
            (ngModelChange)="updateFilters({ from: $event })"
          />
          <input
            class="private-layout__year"
            type="number"
            name="to"
            aria-label="Год выхода до"
            placeholder="До"
            min="1888"
            [ngModel]="filters().to"
            (ngModelChange)="updateFilters({ to: $event })"
          />
        </div>
      </fieldset>

      <fieldset class="private-layout__genres private-layout__filter-group">
        <legend class="private-layout__label">Сортировать</legend>
        @for (option of sortOptions; track option.value) {
          <label class="private-layout__genre">
            <input
              class="private-layout__radio"
              type="radio"
              name="sort"
              [value]="option.value"
              [ngModel]="filters().sort"
              (ngModelChange)="updateFilters({ sort: $event })"
            />
            <span>{{ option.label }}</span>
          </label>
        }
      </fieldset>
    </aside>

    <main class="private-layout__content">
      <router-outlet />
    </main>
  </div>
</div>
